name: Axion
description: 'Axion (formerly Axion Ray) is an AI platform for manufacturing quality intelligence
  that helps global manufacturers detect, diagnose, and resolve product quality and warranty issues
  faster. It unifies customer, service, field, and telematics data to deliver early problem detection,
  root-cause analysis, and improvement tracking, reducing warranty costs and investigation time.
  Customers include Daikin, Harley-Davidson, SharkNinja, Cummins, and Schneider Electric. Founded by
  Daniel First, Axion has raised Series A (led by Bessemer Venture Partners) and Series B (led by
  Salesforce Ventures). Axion is an enterprise SaaS product with no publicly documented API or developer
  platform at this time; this profile captures its company identity, legal, and security/compliance surface.'
